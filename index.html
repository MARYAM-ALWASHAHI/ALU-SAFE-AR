<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>ALU-SAFE AR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Industrial safety training game set in a fictional aluminium smelter.">
<meta name="theme-color" content="#0b2d4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<canvas id="view" aria-label="3D training scene"></canvas>

<!-- loading -->
<section class="screen center" id="s-loading">
  <div class="loader" role="status"><span class="spinner"></span><p data-i18n="loading">Loading…</p></div>
</section>

<!-- unsupported -->
<section class="screen center" id="s-unsupported" hidden>
  <div class="panel narrow"><h2 data-i18n="unsupportedT"></h2><p data-i18n="unsupportedB"></p></div>
</section>

<!-- error -->
<section class="screen center" id="s-error" hidden>
  <div class="panel narrow"><h2 data-i18n="errorT"></h2><p data-i18n="errorB"></p><button class="btn primary" id="btn-reload"><span data-i18n="reload"></span></button></div>
</section>

<!-- home -->
<section class="screen home" id="s-home" hidden>
  <div class="home-card">
    <header class="brand">
      <svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 3l18 10.5v21L24 45 6 34.5v-21z" fill="#0b2d4a" stroke="#00a8a8" stroke-width="2.5"/><path d="M15 31l9-16 9 16z" fill="none" stroke="#c0c6ce" stroke-width="2.5" stroke-linejoin="round"/><path d="M24 22v4.5M24 28.8v.2" stroke="#f2a900" stroke-width="2.6" stroke-linecap="round"/></svg>
      <div><h1>ALU-SAFE <span>AR</span></h1><p class="eyebrow" data-i18n="tagline"></p></div>
      <button class="chip" id="lang-toggle" aria-label="Language"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c3 3.2 3 15.8 0 19M12 2.5c-3 3.2-3 15.8 0 19"/></svg><span>English</span></button>
    </header>
    <p class="lead" data-i18n="heroSub"></p>

    <div>
      <p class="field" data-i18n="difficulty"></p>
      <div class="seg-ctl" role="group">
        <button data-diff="easy" data-i18n="easy"></button>
        <button data-diff="normal" data-i18n="normal"></button>
        <button data-diff="hard" data-i18n="hard"></button>
      </div>
      <p class="note" id="diff-desc"></p>
    </div>

    <button class="btn primary xl" id="btn-play"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l13 8-13 8z" fill="currentColor"/></svg><span data-i18n="play"></span></button>
    <div class="grid3">
      <button class="btn secondary" id="btn-howto"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.3 9.3a2.8 2.8 0 1 1 3.9 2.6c-.8.4-1.2 1-1.2 1.9v.6M12 17.2v.1"/></svg><span data-i18n="howto"></span></button>
      <button class="btn secondary" id="btn-settings"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1"/></svg><span data-i18n="settings"></span></button>
      <button class="btn secondary" id="btn-ar"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M4 7.4l8 4.6 8-4.6M12 12v9.2"/></svg><span data-i18n="arMode"></span></button>
    </div>
    <p class="best" id="best"></p>
    <p class="note" data-i18n="fictional"></p>
    <p class="note" data-i18n="sample"></p>
  </div>
</section>

<!-- mission select -->
<section class="screen home" id="s-missions" hidden>
  <div class="home-card wide-card">
    <header class="ms-head">
      <button class="chip" id="ms-back"><svg class="ico flip-rtl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg><span data-i18n="back"></span></button>
      <div><h2 data-i18n="missionsT"></h2><p class="note" id="ms-sub"></p></div>
    </header>
    <div class="seg-ctl" role="group" id="ms-diff">
      <button data-diff="easy" data-i18n="easy"></button>
      <button data-diff="normal" data-i18n="normal"></button>
      <button data-diff="hard" data-i18n="hard"></button>
    </div>
    <ol class="ms-grid" id="ms-grid"></ol>
    <p class="note" data-i18n="sample"></p>
  </div>
</section>

<!-- in-game HUD -->
<div id="hud" hidden>
  <div class="hud-top">
    <button class="hud-btn" id="btn-pause" data-i18n-aria="paused" aria-label="Pause"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button>
    <div class="objective" aria-live="polite">
      <div class="obj-head"><span id="obj-step"></span><div id="tracker"></div></div>
      <div id="obj-text"></div>
      <ul id="obj-list"></ul>
    </div>
    <div class="score-pill"><span data-i18n="score"></span><b id="score-val">0</b></div>
  </div>
  <div id="timer" hidden><span data-i18n="timeLeft"></span><b id="timer-val">0:00</b></div>
  <div id="compass" hidden><svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l7 10h-4.5v9h-5v-9H5z" fill="currentColor"/></svg><span id="compass-d"></span></div>
  <div id="meter" hidden><span></span><div class="bar"><i></i></div></div>
  <div id="carry" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5c0 3.6-2.4 6.5-6 6.5-2.5 0-4-1.2-5.2-3.2L4.5 13.5a1.5 1.5 0 0 1 2.4-1.8L9 14"/></svg><span></span></div>
  <div id="reticle"></div>
  <div id="focus-tag" hidden></div>
  <div id="stick"><div class="knob"></div></div>
  <button id="btn-interact" hidden><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5c0 3.6-2.4 6.5-6 6.5-2.5 0-4-1.2-5.2-3.2L4.5 13.5a1.5 1.5 0 0 1 2.4-1.8L9 14"/></svg><span data-i18n="interact"></span></button>
  <div id="hint-e" hidden><kbd>E</kbd><span data-i18n="interact"></span></div>
  <div id="sample-banner" data-i18n="sample"></div>
</div>

<div id="visor-fx" aria-hidden="true"></div>
<div id="toast" role="status"></div>
<div id="flash"></div>
<div id="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"></div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
